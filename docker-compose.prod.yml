services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
      args:
        APP_ENV: prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php
    restart: unless-stopped
    volumes:
      - ./public:/var/www/app/public:ro
    networks:
      - appnet

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      target: final
    working_dir: /var/www/app
    env_file:
      - .env
    expose:
      - "9000"
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
      - GNUPGHOME=/var/www/app/config/pgp/key-config
    volumes:
      - ./:/var/www/app
      - ./config/pgp:/var/www/app/config/pgp
    restart: unless-stopped
    networks:
      - appnet

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
