services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
      args:
        APP_ENV: prod
    network_mode: host
    volumes:
      - ./public:/var/www/app/public:ro
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    network_mode: host
    env_file:
      - .env.prod
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
      - GNUPGHOME=/var/www/app/config/pgp/key-config
    volumes:
      - ./:/var/www/app
      - ./config/pgp:/var/www/app/config/pgp
    restart: unless-stopped
