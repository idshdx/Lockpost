services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
      args:
        APP_ENV: prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php
    restart: unless-stopped
    volumes:
      - ./public:/var/www/app/public:ro
      - ./docker/nginx/default.conf.hardened:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      target: final
    working_dir: /var/www/app
    env_file:
      - .env
    expose:
      - "9000"
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
      - GNUPGHOME=/var/www/app/config/pgp/key-config
    volumes:
      - ./:/var/www/app
      - ./config/pgp:/var/www/app/config/pgp
      - ./docker/php/conf.d/opcache-prod.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    restart: unless-stopped
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
