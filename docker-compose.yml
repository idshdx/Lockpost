services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "8080:80"
      - "443:443"
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
      args:
        APP_ENV: dev
    depends_on:
      - php
    restart: 'no'
    volumes:
      - ./public:/var/www/app/public

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      target: dev
    container_name: php
    working_dir: /var/www/app
    expose:
      - "9000"
    volumes:
      - ./:/var/www/app
      - ./config/pgp:/var/www/app/config/pgp:delegated
    environment:
      - GNUPGHOME=/var/www/app/config/pgp/key-config
      - PHP_IDE_CONFIG=serverName=php-symfony-app
    restart: 'no'

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web interface
    restart: 'no'
