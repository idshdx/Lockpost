server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    client_max_body_size 1M;

    # Security headers
    # data: in script-src is required for Symfony AssetMapper's CSS importmap stubs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Prevent token URLs from leaking via Referer header
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # HSTS — only effective over HTTPS. In dev (HTTP-only), browsers ignore this header.
    # In production behind TLS termination, this forces HTTPS for 1 year including subdomains.
    # Remove if serving over plain HTTP in production (e.g. behind a TLS-terminating proxy that
    # sets its own HSTS). See docker/nginx/default.conf.hardened for the production variant.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    access_log off;
    error_log /dev/stdout info;

    root /var/www/app/public;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?_url=$uri&$args;
    }

    location ~ \.php {
        fastcgi_pass php;
        fastcgi_index /index.php;

        include fastcgi_params;
        fastcgi_split_path_info       ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param APP_ENV production;
        fastcgi_connect_timeout 120;
        fastcgi_send_timeout 120;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_intercept_errors on;
    }

    location ~ /\.ht {
        deny all;
    }

    # Silence Chrome DevTools automatic probes — return 204 without hitting PHP-FPM
    location = /.well-known/appspecific/com.chrome.devtools.json {
        access_log off;
        return 204;
    }

    # Prevent token strings from leaking into access logs (defense-in-depth)
    location ~ ^/submit/ {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri $uri/ /index.php?_url=$uri&$args;
    }
    location ~ ^/message/submit {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri $uri/ /index.php?_url=$uri&$args;
    }
    # Prevent caching of the verify page (contains server public key)
    location = /verify {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    location /nginx_status {
        stub_status on;
        access_log   off;
        allow 127.0.0.1;
        deny all;
    }

    location ~ ^/(status|ping)$ {
        allow 127.0.0.1;
        deny all;
        access_log off;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
